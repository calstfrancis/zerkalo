app-id: io.github.calstfrancis.Zerkalo
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: zerkalo

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --filesystem=home
  - --filesystem=xdg-documents
  - --filesystem=~/.cache/typst
  - --share=network
  - --talk-name=org.freedesktop.portal.Desktop
  - --talk-name=org.freedesktop.Flatpak
  - --talk-name=org.freedesktop.secrets
  - --socket=ssh-auth
  # Printing normally goes through the print portal, which needs no permission
  # beyond the portal talk-name above. This is for the GTK fallback used when no
  # portal answers: without it that path enumerates zero printers inside the
  # sandbox, so the fallback would open an empty dialog rather than failing
  # honestly.
  - --socket=cups

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_TARGET_DIR: /app/zerkalo-cargo-target
    RUST_BACKTRACE: '1'

modules:
  # Module 0: git itself.
  #
  # org.gnome.Platform ships no git, so sync used to run the *host's* git
  # through flatpak-spawn — which made "install git in a terminal" a
  # prerequisite for saving your work in the app's main distribution. Bundling
  # it means setup never has to ask the user to install anything.
  #
  # Everything this links against is already in the runtime: libcurl, zlib,
  # openssl, expat and the CA bundle at /etc/ssl/certs. NO_PERL is safe because
  # every command Zerkalo runs (init, add, commit, pull --rebase, push, status,
  # rev-parse, config) is a C builtin; the perl-based extras are not used.
  # INSTALL_SYMLINKS keeps the ~150 builtins as symlinks to one binary instead
  # of copies.
  #
  # NO_RUST is not optional here, despite git treating it as optional. Since
  # 2.51 git builds part of itself in Rust into `target/release/libgitcore.a`,
  # a path relative to its own build directory — but this manifest sets
  # CARGO_TARGET_DIR globally (for Zerkalo's own two cargo modules), so git's
  # cargo writes the archive to /app/zerkalo-cargo-target and the link step
  # then fails with "cannot find target/release/libgitcore.a". NO_RUST=1 uses
  # the C implementations instead and never invokes cargo at all.
  # Git 3.0 will make Rust mandatory; at that point this module needs
  # CARGO_TARGET_DIR overridden back to `target` rather than NO_RUST.
  - name: git
    buildsystem: simple
    sources:
      - type: archive
        url: https://mirrors.edge.kernel.org/pub/software/scm/git/git-2.55.0.tar.xz
        sha256: 457fdb04dc8728e007d4688695e6912e6f680727920f2a40bf11eacc17505357
    build-commands:
      # Fail loudly rather than silently producing a git that can't do HTTPS —
      # the Makefile's response to a missing curl-config is to build without
      # it, which would leave push working only for SSH remotes.
      - "test -x /usr/bin/curl-config || (echo 'curl-config missing, git would build without HTTPS' && false)"
      - "make -j${FLATPAK_BUILDER_N_JOBS:-4} prefix=/app NO_TCLTK=1 NO_GETTEXT=1 NO_PERL=1 NO_PYTHON=1 NO_RUST=1 NO_INSTALL_HARDLINKS=1 INSTALL_SYMLINKS=1 all"
      - "make prefix=/app NO_TCLTK=1 NO_GETTEXT=1 NO_PERL=1 NO_PYTHON=1 NO_RUST=1 NO_INSTALL_HARDLINKS=1 INSTALL_SYMLINKS=1 install"
      # Left alone this module installs 118MB: git and each of its helpers link
      # their own copy of libgit.a, and nothing is stripped by default. Dropping
      # the server-side helpers Zerkalo can never use and stripping the rest
      # brings it to ~14MB, verified by running these steps against the real SDK.
      - "rm -f /app/bin/scalar /app/bin/git-shell /app/bin/git-cvsserver"
      - "rm -f /app/libexec/git-core/scalar /app/libexec/git-core/git-shell /app/libexec/git-core/git-daemon /app/libexec/git-core/git-http-backend /app/libexec/git-core/git-imap-send /app/libexec/git-core/git-cvsserver"
      - "find /app/bin /app/libexec/git-core -type f -exec strip --strip-unneeded {} + 2>/dev/null || true"
    cleanup:
      - /share/gitweb
      - /share/git-gui

  # Module 1: compile all cargo dependencies.
  # Cache key is based only on Cargo.toml, Cargo.lock, and cargo-sources.json.
  # This module is skipped (cache hit) on dev builds that don't change dependencies.
  - name: zerkalo-deps
    buildsystem: simple
    build-options:
      env:
        CARGO_HOME: /run/build/zerkalo-deps/cargo
        CARGO_NET_OFFLINE: 'true'
    sources:
      - type: file
        path: ../Cargo.toml
      - type: file
        path: ../Cargo.lock
      - cargo-sources.json
    build-commands:
      # Copy vendor sources to a stable /app/ path so Module 2 uses the same path
      # in cargo fingerprints (fingerprints are path-sensitive for vendor sources).
      - cp -r cargo/vendor /app/zerkalo-cargo-vendor
      # Tags read from Cargo.toml itself (already a source, above) rather than
      # hardcoded here — a hardcoded copy silently went stale after a Kartoteka
      # version bump: cargo-sources.json's own vendoring correctly tracked the
      # new tag, but this file's literal `tag = "..."` didn't, so cargo tried to
      # fetch the new tag from the real network mid-offline-build and failed.
      # Reading Cargo.toml here means this can never drift again.
      - |
        set -e
        SKRIZHAL_TAG=$(grep 'calstfrancis/skrizhal' Cargo.toml | grep -o 'tag = "[^"]*"' | head -1 | cut -d'"' -f2)
        KARTOTEKA_TAG=$(grep 'calstfrancis/kartoteka' Cargo.toml | grep -o 'tag = "[^"]*"' | head -1 | cut -d'"' -f2)
        printf '[source.vendored-sources]\ndirectory = "/app/zerkalo-cargo-vendor"\n\n[source.crates-io]\nreplace-with = "vendored-sources"\n\n[source."https://github.com/calstfrancis/skrizhal"]\ngit = "https://github.com/calstfrancis/skrizhal"\nreplace-with = "vendored-sources"\ntag = "%s"\n\n[source."https://github.com/calstfrancis/kartoteka"]\ngit = "https://github.com/calstfrancis/kartoteka"\nreplace-with = "vendored-sources"\ntag = "%s"\n' "$SKRIZHAL_TAG" "$KARTOTEKA_TAG" > cargo/config
      # Stub main.rs so cargo compiles all deps but not the real app code
      - mkdir -p src
      - echo 'fn main() {}' > src/main.rs
      - cargo --offline build --release --manifest-path Cargo.toml
      # Remove stub zerkalo artifacts so Module 2 always recompiles from real source
      - rm -f /app/zerkalo-cargo-target/release/zerkalo
      - rm -f /app/zerkalo-cargo-target/release/zerkalo.d
      - rm -rf /app/zerkalo-cargo-target/release/.fingerprint/zerkalo-*
      - rm -rf /app/zerkalo-cargo-target/release/deps/zerkalo-*

  # Module 2: compile only the zerkalo crate, using pre-built deps from Module 1.
  # Cache key includes all source files, so it always misses on code changes —
  # but cargo only recompiles the zerkalo crate itself (deps are already built).
  - name: zerkalo
    buildsystem: simple
    build-options:
      env:
        CARGO_HOME: /run/build/zerkalo/cargo
        CARGO_NET_OFFLINE: 'true'
    sources:
      - type: git
        url: https://github.com/calstfrancis/zerkalo.git
        branch: main
      - type: archive
        url: https://github.com/Myriad-Dreamin/tinymist/releases/download/v0.14.18/tinymist-x86_64-unknown-linux-gnu.tar.gz
        sha256: 8033383d691165d567c5ccd83888dca2b629fcc1054da6eef8c81e1715df8ca9
        dest: tinymist-bin
      - type: file
        path: io.github.calstfrancis.Zerkalo.metainfo.xml
    build-commands:
      # Point cargo at the vendor dir and pre-built target from zerkalo-deps.
      # Tags read from Cargo.toml itself (checked out via the git source above)
      # rather than hardcoded — see the matching comment in the zerkalo-deps
      # module for why a literal copy here goes stale.
      - mkdir -p cargo
      - |
        set -e
        SKRIZHAL_TAG=$(grep 'calstfrancis/skrizhal' Cargo.toml | grep -o 'tag = "[^"]*"' | head -1 | cut -d'"' -f2)
        KARTOTEKA_TAG=$(grep 'calstfrancis/kartoteka' Cargo.toml | grep -o 'tag = "[^"]*"' | head -1 | cut -d'"' -f2)
        printf '[source.vendored-sources]\ndirectory = "/app/zerkalo-cargo-vendor"\n\n[source.crates-io]\nreplace-with = "vendored-sources"\n\n[source."https://github.com/calstfrancis/skrizhal"]\ngit = "https://github.com/calstfrancis/skrizhal"\nreplace-with = "vendored-sources"\ntag = "%s"\n\n[source."https://github.com/calstfrancis/kartoteka"]\ngit = "https://github.com/calstfrancis/kartoteka"\nreplace-with = "vendored-sources"\ntag = "%s"\n' "$SKRIZHAL_TAG" "$KARTOTEKA_TAG" > cargo/config
      # zerkalo-deps' pre-built target dir lives in the shared /app tree,
      # which flatpak-builder mounts read-only via rofiles-fuse whenever that
      # module is a cache hit (i.e. most builds, once dependencies stop
      # changing) — cargo still re-touches every dependency's fingerprint
      # file to reconfirm it's current even when nothing needs recompiling,
      # and rewriting a file from that read-only base fails with "Read-only
      # file system". Copying it into this module's own (always-writable)
      # build directory first, and pointing CARGO_TARGET_DIR at the copy,
      # keeps the pre-built deps (no recompile) without requiring in-place
      # writes to the shared tree.
      - cp -a /app/zerkalo-cargo-target ./writable-cargo-target
      - CARGO_TARGET_DIR=./writable-cargo-target cargo --offline build --release --manifest-path Cargo.toml
      - install -Dm755 ./writable-cargo-target/release/zerkalo /app/bin/zerkalo
      - strip /app/bin/zerkalo
      # Clean up build artifacts before finalising the module state
      - rm -rf /app/zerkalo-cargo-vendor /app/zerkalo-cargo-target ./writable-cargo-target
      - install -Dm755 tinymist-bin/tinymist /app/lib/zerkalo/tinymist
      - strip /app/lib/zerkalo/tinymist
      - sed -i 's/^Icon=zerkalo/Icon=io.github.calstfrancis.Zerkalo/' packaging/io.github.calstfrancis.Zerkalo.desktop
      - install -Dm644 packaging/io.github.calstfrancis.Zerkalo.desktop /app/share/applications/io.github.calstfrancis.Zerkalo.desktop
      - install -Dm644 packaging/zerkalo.svg /app/share/icons/hicolor/scalable/apps/io.github.calstfrancis.Zerkalo.svg
      # install.sh (the non-flatpak path) has always rasterised these same sizes
      # alongside the SVG, because launchers/docks that don't invoke an SVG
      # loader (missing librsvg's gdk-pixbuf loader on the host, some app
      # grids and panels) show a blank or generic icon for SVG-only apps. The
      # flatpak manifest only ever installed the scalable SVG, so the icon
      # showed inconsistently for flatpak installs depending on the launcher.
      - |
        for SIZE in 16 24 32 48 64 96 128 256; do
          mkdir -p "/app/share/icons/hicolor/${SIZE}x${SIZE}/apps"
          rsvg-convert -w "${SIZE}" -h "${SIZE}" packaging/zerkalo.svg \
            -o "/app/share/icons/hicolor/${SIZE}x${SIZE}/apps/io.github.calstfrancis.Zerkalo.png"
        done
      - install -Dm644 io.github.calstfrancis.Zerkalo.metainfo.xml /app/share/metainfo/io.github.calstfrancis.Zerkalo.metainfo.xml
      - install -Dm644 packaging/gosttypeb.ttf /app/share/fonts/gosttypeb.ttf
