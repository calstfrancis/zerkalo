[package]
name = "zerkalo"
version = "0.21.0-dev1"
edition = "2021"
license = "MIT"
description = "Contemplative Typst editor with live preview, LSP completions, and git sync"
homepage = "https://github.com/calstfrancis/zerkalo"
repository = "https://github.com/calstfrancis/zerkalo"

[dependencies]
gtk4 = { version = "0.7", features = ["v4_10"] }
libadwaita = { version = "0.5", features = ["v1_4"] }
sourceview5 = "0.7"
glib = "0.18"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["registry", "fmt"] }
tracing-appender = "0.2"
git2 = "0.20"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
keyring = { version = "3", features = ["sync-secret-service"] }
regex = "1.10"
chrono = "0.4"
shellexpand = "3.1"
notify = "6"
rusqlite = { version = "0.31", features = ["bundled"] }
biblatex = "0.11"
hayagriva = "0.9"

# Skrizhal CV entry schema/parsing (no GTK deps — see skrizhal's plan.md
# for why this is the core crate specifically, not the `skrizhal` GUI
# package, which pins an incompatible gtk4/libadwaita version).
skrizhal-core = { git = "https://github.com/calstfrancis/skrizhal", tag = "v0.3.0" }

# Embedded Typst compiler
typst = "0.14"
typst-render = "0.14"
typst-pdf = "0.14"
typst-kit = { version = "0.14", features = ["embed-fonts"] }
tiny-skia = { version = "0.11", features = ["png"] }
url = "2"
ashpd = { version = "0.13.13", default-features = false, features = ["print", "tokio"] }
lopdf = { version = "0.44.0", default-features = false }
# Document import without pandoc for the formats that don't need it: .docx and
# .odt are ZIP archives of XML, .md is text. Keeps the common import paths
# working with nothing installed outside Zerkalo.
zip = { version = "2", default-features = false, features = ["deflate"] }
roxmltree = "0.20"
pulldown-cmark = { version = "0.13", default-features = false }

[dev-dependencies]
tempfile = "3"

[profile.dev]
debug = 1
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

# ── Debian/Ubuntu package (.deb) ─────────────────────────────────────────────
[package.metadata.deb]
name = "zerkalo"
maintainer = "Cal St Francis <calstfrancis@gmail.com>"
copyright = "2026, Cal St Francis"
section = "text"
priority = "optional"
depends = "libc6, libglib2.0-0, libgtk-4-1 (>= 4.10), libadwaita-1-0 (>= 1.4), libgtksourceview-5-0, libcairo2, libgdk-pixbuf-2.0-0, libpango-1.0-0, libssl3, zlib1g, git, pandoc, hunspell"
assets = [
    ["target/release/zerkalo", "usr/bin/", "755"],
    ["packaging/io.github.calstfrancis.Zerkalo.desktop", "usr/share/applications/", "644"],
    ["packaging/zerkalo.svg", "usr/share/icons/hicolor/scalable/apps/zerkalo.svg", "644"],
    ["packaging/tinymist", "usr/lib/zerkalo/tinymist", "755"],
]

# ── RPM package (Fedora/openSUSE/RHEL) ───────────────────────────────────────
[package.metadata.generate-rpm]

[[package.metadata.generate-rpm.assets]]
source = "target/release/zerkalo"
dest = "/usr/bin/zerkalo"
mode = "755"

[[package.metadata.generate-rpm.assets]]
source = "packaging/io.github.calstfrancis.Zerkalo.desktop"
dest = "/usr/share/applications/io.github.calstfrancis.Zerkalo.desktop"
mode = "644"

[[package.metadata.generate-rpm.assets]]
source = "packaging/zerkalo.svg"
dest = "/usr/share/icons/hicolor/scalable/apps/zerkalo.svg"
mode = "644"

[[package.metadata.generate-rpm.assets]]
source = "packaging/tinymist"
dest = "/usr/lib/zerkalo/tinymist"
mode = "755"

[package.metadata.generate-rpm.requires]
git = "*"
pandoc = "*"
hunspell = "*"
