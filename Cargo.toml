[package]
name = "zerkalo"
version = "0.7.1"
edition = "2021"

[dependencies]
gtk4 = { version = "0.7", features = ["v4_10"] }
libadwaita = { version = "0.5", features = ["v1_4"] }
sourceview5 = "0.7"
glib = "0.18"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["registry", "fmt"] }
tracing-appender = "0.2"
git2 = "0.20"
regex = "1.10"
chrono = "0.4"
shellexpand = "3.1"

# Embedded Typst compiler
typst = "0.14"
typst-render = "0.14"
typst-pdf = "0.14"
typst-kit = "0.14"
tiny-skia = { version = "0.11", features = ["png"] }

[profile.dev]
debug = 1
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
