[package]
name = "zerkalo"
version = "0.2.0"
edition = "2021"

[dependencies]
gtk4 = { version = "0.7", features = ["v4_10"] }
libadwaita = { version = "0.5", features = ["v1_4"] }
sourceview5 = "0.7"
glib = "0.18"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["registry", "fmt"] }
tracing-appender = "0.2"
git2 = "0.20"
regex = "1.10"
chrono = "0.4"
shellexpand = "3.1"

[profile.release]
opt-level = 3
lto = true
