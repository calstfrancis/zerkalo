[package]
name = "zerkalo"
version = "0.28.5"
edition = "2021"
license = "MIT"
description = "Contemplative Typst editor with live preview, LSP completions, and git sync"
homepage = "https://github.com/calstfrancis/zerkalo"
repository = "https://github.com/calstfrancis/zerkalo"

[dependencies]
gtk4 = { version = "0.11", features = ["v4_10"] }
libadwaita = { version = "0.9", features = ["v1_4"] }
sourceview5 = { version = "0.11", features = ["gtk_v4_10"] }
glib = "0.22"
tokio = { version = "1", features = ["rt"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["registry", "fmt"] }
tracing-appender = "0.2"
git2 = "0.20"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
keyring = { version = "3", features = ["sync-secret-service"] }
regex = "1.10"
chrono = "0.4"
shellexpand = "3.1"
notify = "6"
rusqlite = { version = "0.40", features = ["bundled"] }
biblatex = "0.12"
hayagriva = "0.10"

# Skrizhal CV entry schema/parsing (no GTK deps — see skrizhal's plan.md
# for why this is the core crate specifically, not the `skrizhal` GUI
# package, which pins an incompatible gtk4/libadwaita version).
skrizhal-core = { git = "https://github.com/calstfrancis/skrizhal", tag = "v0.4.0" }

# Kartoteka's shared bibliography model and vault file-watcher, for tight
# integration with a Kartoteka vault as a live bibliography source (no
# "acquire" feature — that pulls in reqwest/tokio for DOI/ISBN lookup,
# irrelevant here).
fond-bib = { git = "https://github.com/calstfrancis/kartoteka", tag = "v0.7.0" }
fond-vault = { git = "https://github.com/calstfrancis/kartoteka", tag = "v0.7.0" }

# Embedded Typst compiler
typst = "0.15"
typst-layout = "0.15"
typst-render = "0.15"
typst-pdf = "0.15"
typst-html = "0.15"
typst-kit = { version = "0.15", features = ["embedded-fonts", "scan-fonts", "system-packages", "universe-packages", "system-downloader"] }
url = "2"
ashpd = { version = "0.13.13", default-features = false, features = ["print", "tokio"] }
lopdf = { version = "0.44.0", default-features = false }
# Document import without pandoc for the formats that don't need it: .docx and
# .odt are ZIP archives of XML, .md is text. Keeps the common import paths
# working with nothing installed outside Zerkalo.
zip = { version = "2", default-features = false, features = ["deflate"] }
roxmltree = "0.21"
pulldown-cmark = { version = "0.13", default-features = false }
fluent-templates = "0.15.1"
unic-langid = { version = "0.9.6", features = ["macros"] }

# Spell checking, in-process against the same Hunspell-format dictionaries
# the system already has installed — no `hunspell` binary/subprocess. Used
# by the Helix editor for the same purpose.
spellbook = "0.4"

[dev-dependencies]
tempfile = "3"

[profile.dev]
debug = 1
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
