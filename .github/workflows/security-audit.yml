name: Security audit

on:
  push:
    branches: [ main ]
    paths:
      - '**/Cargo.toml'
      - '**/Cargo.lock'
  pull_request:
    branches: [ main ]
    paths:
      - '**/Cargo.toml'
      - '**/Cargo.lock'
  schedule:
    # Catches advisories published against already-pinned dependencies, not
    # just ones introduced by a Cargo.lock change.
    - cron: '0 6 * * 1'

jobs:
  security_audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      # Fails on vulnerabilities only; unmaintained/unsound warnings are printed but don't fail the job.
      - name: Audit
        run: cargo audit
