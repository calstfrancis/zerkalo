name: Release flatpak

# Triggers on the same tag pattern release.yml (the GitHub Release workflow) uses, plus a
# manual dispatch ("Run workflow" in the Actions tab, from any browser or phone, with the
# version to publish) that needs no local git at all: it builds and publishes the flatpak
# from the chosen branch (main), then creates the vX.Y.Z tag and GitHub Release itself.
# Requires two repo secrets that only Cal can set up (see zerkalo/RELEASE-CI-SETUP.md):
#   FLATPAK_GPG_PRIVATE_KEY — armored export of the signing key
#   FLATPAK_REPO_TOKEN      — a token with push access to calstfrancis/flatpak
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (must match Cargo.toml, e.g. 0.24.5)"
        required: true

jobs:
  publish-flatpak:
    runs-on: ubuntu-24.04
    # Generous headroom: up to 15 min just waiting on ci.yml (see the polling loop below),
    # plus the actual build (a couple minutes locally with warm caches, longer cold on a
    # runner with nothing cached yet) — without leaving a hang to run for GitHub's 6-hour
    # default.
    timeout-minutes: 45
    permissions:
      contents: write   # the manual-run path creates the tag and GitHub Release
      checks: read      # the CI gate below reads check-runs
    steps:
      - uses: actions/checkout@v4

      # Structural version of a check CLAUDE.md used to ask Cal to remember to do by hand:
      # don't publish a build from a commit whose own CI run (build/test/clippy) didn't pass.
      # Applies to manual runs too: a release is only built from a commit whose CI is green.
      - name: Require CI to have passed for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA="${{ github.sha }}"
          # The legacy commits/{sha}/status API doesn't reflect GitHub Actions results at
          # all (always empty/pending for Actions-only repos) — check-runs is the one that
          # does. ci.yml's two jobs are named "build" and "version-consistency".
          #
          # publish-flatpak.sh pushes main and the tag back to back, and ci.yml triggers off
          # the main push — so ci.yml is often still running (conclusion "") when this step
          # first checks, not actually failed. Poll instead of checking once: up to 60
          # attempts, 15s apart (15 minutes). ci.yml's build job has consistently taken
          # ~6-6.5 minutes in practice; a first 5-minute window (20 attempts) wasn't enough
          # margin and this step gave up mid-build on a real release attempt.
          for JOB in build version-consistency; do
            CONCLUSION=""
            for attempt in $(seq 1 60); do
              CONCLUSION=$(gh api "repos/${{ github.repository }}/commits/$SHA/check-runs" \
                --jq ".check_runs[] | select(.name == \"$JOB\") | .conclusion")
              if [[ -n "$CONCLUSION" ]]; then
                break
              fi
              echo "ci.yml '$JOB' for $SHA hasn't finished yet (attempt $attempt/60) — waiting..."
              sleep 15
            done
            if [[ "$CONCLUSION" != "success" ]]; then
              echo "ERROR: ci.yml's '$JOB' job for commit $SHA is '$CONCLUSION', not 'success' — refusing to publish."
              exit 1
            fi
            echo "ci.yml '$JOB' for $SHA: $CONCLUSION"
          done

      # Mirrors publish-flatpak.sh's own sanity check.
      - name: Verify version matches Cargo.toml
        run: |
          set -euo pipefail
          VERSION="${{ github.event.inputs.version || '' }}"
          if [[ -z "$VERSION" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          CARGO_VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          if [[ "$CARGO_VERSION" != "$VERSION" ]]; then
            echo "ERROR: Cargo.toml says version is '$CARGO_VERSION', but this run is for '$VERSION'."
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Install flatpak and flatpak-builder
        # Ubuntu 24.04 runners silently hang here otherwise: needrestart intercepts apt
        # installs that touch certain libraries and prompts interactively for which
        # services to restart, even with `apt-get install -y` — there's nothing to answer
        # that prompt in CI, so the step just sits forever with no error and no log output.
        # NEEDRESTART_MODE=a (automatic, no prompt) is the documented fix.
        #
        # Separately, Azure's mirror for Ubuntu's noble-security pocket periodically hangs
        # fetching InRelease with no timeout — apt has no default network timeout, so a
        # stalled TCP connection there also sits forever with no error. Acquire::Retries/
        # Acquire::http(s)::Timeout bound each attempt (~20s) and retry a few times, so a
        # bad mirror fails fast and gets retried instead of hanging the whole job.
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: |
          APT_OPTS="-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
          sudo apt-get update $APT_OPTS
          sudo apt-get install -y $APT_OPTS flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo

      - name: Determine runtime/extension versions
        # org.freedesktop.Sdk.Extension.rust-stable is versioned against the Freedesktop SDK
        # release GNOME's runtime pairs with, not the GNOME runtime number itself — install
        # failed with "Nothing matches ... in remote flathub" trying //50, since no such
        # branch exists for this extension. GNOME Platform/Sdk 50 pairs with Freedesktop SDK
        # 25.08 (confirmed via the installed Sdk 50's own metadata: every one of its other
        # org.freedesktop.Platform.* extension points names 25.08 explicitly). This mapping
        # isn't derivable from the manifest, which never states it — flatpak-builder resolves
        # it automatically at build time, but this pre-install step has to know it by hand,
        # so it'll need updating by hand too if runtime-version ever moves past 50.
        run: |
          RUNTIME_VERSION=$(grep '^runtime-version' packaging/io.github.calstfrancis.Zerkalo.yml | sed "s/runtime-version: *'\(.*\)'/\1/")
          echo "RUNTIME_VERSION=$RUNTIME_VERSION" >> "$GITHUB_ENV"
          echo "RUST_EXTENSION_BRANCH=25.08" >> "$GITHUB_ENV"

      # Flathub's CDN has repeatedly 404'd on the same static-delta object partway through
      # this pull, specifically from GitHub-hosted runners (reproduces every time from here,
      # while the same ref pulls fine locally and even resolves fine via `remote-info` on the
      # runner, which only reads metadata, not the delta) — not a one-off blip, a systemic
      # network-path issue. Caching the installed --user flatpak dir sidesteps it entirely
      # after the first successful install: once the cache is warm, the `flatpak install`
      # below finds everything already present and never touches the network. Keyed on the
      # runtime/extension versions so a bump invalidates it automatically.
      - name: Cache flatpak user installation
        uses: actions/cache@v4
        with:
          path: ~/.local/share/flatpak
          key: flatpak-gnome${{ env.RUNTIME_VERSION }}-rust${{ env.RUST_EXTENSION_BRANCH }}-v1

      - name: Install runtime, SDK, and rust-stable extension
        run: |
          REFS=(
            "org.gnome.Platform//$RUNTIME_VERSION"
            "org.gnome.Sdk//$RUNTIME_VERSION"
            "org.freedesktop.Sdk.Extension.rust-stable//$RUST_EXTENSION_BRANCH"
          )
          # Cache hit: everything's already installed, this is a fast no-op with no network
          # traffic. Cache miss: falls through to the retry/no-static-deltas fallback below
          # for the same CDN flakiness described above.
          for attempt in 1 2 3; do
            if flatpak install --user -y flathub "${REFS[@]}"; then
              exit 0
            fi
            echo "flatpak install attempt $attempt failed, retrying in 15s…"
            sleep 15
          done
          echo "Retrying once more with --no-static-deltas…"
          flatpak install --user -y --no-static-deltas flathub "${REFS[@]}"

      - name: Import GPG signing key
        run: |
          echo "${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}" | gpg --batch --import

      # The signing key has a passphrase, so importing it isn't enough — flatpak build-export
      # (via libostree, via GPGME) asks gpg-agent for a signature and gpg-agent will try to
      # prompt for that passphrase interactively, which has nothing to prompt on here and just
      # fails. Preset it into the agent's cache instead, once, up front — every later signing
      # operation in this job (build-export and build-update-repo, both keyed by the same
      # keygrip) then finds it already unlocked and never needs the passphrase again.
      - name: Preset GPG passphrase into the agent
        run: |
          set -euo pipefail
          mkdir -p ~/.gnupg
          echo "allow-preset-passphrase" >> ~/.gnupg/gpg-agent.conf
          gpgconf --kill gpg-agent
          gpgconf --launch gpg-agent
          KEYGRIP=$(gpg --with-colons --with-keygrip --list-secret-keys \
            A2918A9B43B199ADF9879F934AC9D5173DE4BC41 | awk -F: '/^grp/ {print $10; exit}')
          PRESET_BIN=""
          for candidate in "$(command -v gpg-preset-passphrase 2>/dev/null || true)" \
            /usr/lib/gnupg/gpg-preset-passphrase /usr/lib/gnupg2/gpg-preset-passphrase; do
            if [[ -x "$candidate" ]]; then
              PRESET_BIN="$candidate"
              break
            fi
          done
          if [[ -z "$PRESET_BIN" ]]; then
            echo "ERROR: gpg-preset-passphrase not found anywhere expected." >&2
            exit 1
          fi
          echo "${{ secrets.FLATPAK_GPG_PASSPHRASE }}" | "$PRESET_BIN" --preset "$KEYGRIP"

      - name: Build flatpak
        run: |
          flatpak-builder --force-clean --user --install build-flatpak \
            packaging/io.github.calstfrancis.Zerkalo.yml

      # The flatpak repo is shared by every app's release, so two releases finishing at once
      # race to push it (Kartoteka and Sputnik 0.18.2, 2026-09-29). `git pull --rebase` can't
      # resolve that: `summary`/`summary.sig` and the shared appstream branch are regenerated
      # and signed on every export, so a rebase either conflicts or silently drops the other
      # app's appstream data. Instead, a rejected push resets to the repo's new state and redoes
      # the export, summary, and signature check on top of it.
      - name: Export into the flatpak repo and push
        env:
          REPO_TOKEN: ${{ secrets.FLATPAK_REPO_TOKEN }}
        run: |
          set -euo pipefail
          APP_ID="io.github.calstfrancis.Zerkalo"
          KEY=A2918A9B43B199ADF9879F934AC9D5173DE4BC41
          REPO=/tmp/flatpak-checkout
          git clone "https://x-access-token:${REPO_TOKEN}@github.com/calstfrancis/flatpak" "$REPO"
          git -C "$REPO" config user.name "github-actions[bot]"
          git -C "$REPO" config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            echo "::group::Export and sign (attempt $attempt)"
            flatpak build-export --gpg-sign="$KEY" "$REPO" build-flatpak master
            flatpak build-update-repo --gpg-sign="$KEY" "$REPO"
            echo "::endgroup::"

            # build-export silently produces an unsigned commit if --gpg-sign is missing or the
            # key is unavailable — catch that here rather than on someone else's install.
            COMMIT="$(cat "$REPO/refs/heads/app/$APP_ID/x86_64/master")"
            if [[ ! -f "$REPO/objects/${COMMIT:0:2}/${COMMIT:2}.commitmeta" ]]; then
              echo "ERROR: commit $COMMIT for $APP_ID carries no GPG signature."
              exit 1
            fi
            echo "Signature verified for $APP_ID"

            git -C "$REPO" add -A
            git -C "$REPO" commit -q -m "Zerkalo $VERSION"
            if git -C "$REPO" push origin main; then
              exit 0
            fi

            echo "Push rejected — another release published first. Retrying on top of it."
            sleep $((attempt * 20))
            git -C "$REPO" fetch origin main
            git -C "$REPO" reset --hard origin/main
            git -C "$REPO" clean -fdxq
          done
          echo "ERROR: still rejected after 5 attempts."
          exit 1

      # Manual runs have no pushed tag, so create it (and the GitHub Release release.yml would
      # have made from it) here, once the flatpak is safely published. Tag-triggered runs skip
      # this: the tag, and release.yml, already exist. A tag that already exists is left alone.
      - name: Tag and create the GitHub Release (manual runs)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1 \
            || git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists — leaving it alone."
            exit 0
          fi
          gh release create "$TAG" --target "$GITHUB_SHA" \
            --title "Zerkalo $TAG" --notes-file RELEASE.md screenshots/*.png
