name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  packages:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libadwaita-1-dev \
            libgtksourceview-5-dev \
            libgit2-dev \
            libssl-dev \
            pkg-config \
            gcc

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}

      - name: Install cargo-deb and cargo-generate-rpm
        run: cargo install cargo-deb cargo-generate-rpm

      - name: Build release binary
        run: cargo build --release

      - name: Download tinymist
        run: |
          TINYMIST_URL=$(curl -fsSL https://api.github.com/repos/Myriad-Dreamin/tinymist/releases/latest \
            | grep -o '"browser_download_url":"[^"]*tinymist-x86_64-unknown-linux-gnu\.tar\.gz"' \
            | grep -o 'https://[^"]*')
          curl -fsSL "$TINYMIST_URL" \
            | tar -xz --strip-components=1 -C packaging/ \
              tinymist-x86_64-unknown-linux-gnu/tinymist
          chmod +x packaging/tinymist

      - name: Build .deb package
        run: cargo deb --no-build --no-strip

      - name: Build .rpm package
        run: cargo generate-rpm

      - name: Collect packages
        run: |
          mkdir -p dist
          cp target/debian/*.deb dist/
          cp target/generate-rpm/*.rpm dist/
          ls -lh dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
