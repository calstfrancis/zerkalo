name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  version-consistency:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check version / metainfo consistency
        run: ./check-versions.sh

  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libadwaita-1-dev \
            libgtksourceview-5-dev \
            libgit2-dev \
            libssl-dev \
            libdbus-1-dev \
            pkg-config \
            gcc

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build
        run: cargo build --release

      - name: Test
        run: cargo test --release

      # -D warnings, not a bare `cargo clippy`: without it the job passes no
      # matter how many warnings accumulate, which is how the tree reached 225
      # of them. The codebase is at zero — keep it there.
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
